trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- pwsh: |
    Write-Host "Master pipeline - startar child pipelines parallellt"

    $organization = "$(System.CollectionUri)"
    $project      = "$(System.TeamProject)"

    # Läs pipeline-konfiguration
    $pipelines = Get-Content "pipelines.json" | ConvertFrom-Json

    # Lista för spårning
    $startedPipelines = @()

    foreach ($pipeline in $pipelines) {

        $name       = $pipeline.name
        $pipelineId = $pipeline.pipelineId

        Write-Host "➡️ Startar pipeline: $name (Id: $pipelineId)"

        $url = "${organization}${project}/_apis/pipelines/$pipelineId/runs?api-version=7.0"

        $headers = @{
            Authorization = "Bearer $(System.AccessToken)"
            "Content-Type" = "application/json"
        }

        $response = Invoke-RestMethod `
            -Method Post `
            -Uri $url `
            -Headers $headers `
            -Body "{}"

        $startedPipelines += [PSCustomObject]@{
            Name       = $name
            PipelineId = $pipelineId
            RunId      = $response.id
            WebUrl     = $response._links.web.href
        }

        Write-Host "✅ $name startad (RunId: $($response.id))"
    }

    Write-Host ""
    Write-Host "Sammanfattning - startade pipelines:"
    Write-Host "-------------------------------------"

    foreach ($p in $startedPipelines) {
        Write-Host "App:        $($p.Name)"
        Write-Host "PipelineId: $($p.PipelineId)"
        Write-Host "RunId:      $($p.RunId)"
        Write-Host "Url:        $($p.WebUrl)"
        Write-Host ""
    }

    Write-Host "Alla pipelines är startade och kör nu oberoende av varandra"
  displayName: "Trigger child pipelines (parallel + tracking)"